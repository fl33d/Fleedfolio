name: Bug report
description: Report a reproducible problem with the editor or public portfolio.
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behaviour without sharing passwords or publishing tokens.
      placeholder: I expected … but instead …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: '1. Open …\n2. Click …\n3. Observe …'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox on Linux, Chrome on Android, …
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or other context (optional)
      description: Please redact personal data and secrets.
