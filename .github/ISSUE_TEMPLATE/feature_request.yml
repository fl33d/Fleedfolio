name: Feature request
description: Suggest a focused improvement.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the user need before suggesting a feature.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested behaviour
      placeholder: A minimal implementation would …
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives (optional)
